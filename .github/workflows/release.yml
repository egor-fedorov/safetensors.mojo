name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      PREFIX_CHANNEL: egor-fedorov/safetensors-mojo

    steps:
      - name: Check out release tooling
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
          persist-credentials: false

      - name: Check out the release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail

          python \
            "${GITHUB_WORKSPACE}/release-tooling/tools/release/validate_release.py" \
            --manifest pixi.toml \
            --tag "${RELEASE_TAG}"

          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "::error::Checked-out commit does not match ${RELEASE_TAG}"
            exit 1
          fi

      - name: Install pinned Pixi environment
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.77.1
          cache: true
          frozen: true
          working-directory: source

      - name: Run repository checks
        run: pixi run check

      - name: Build exactly one Conda package
        id: candidate
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .pixi/packages dist
          pixi run package-build

          mapfile -d '' packages < <(
            find .pixi/packages -maxdepth 1 -type f -name '*.conda' -print0
          )
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one .conda package, found ${#packages[@]}"
            exit 1
          fi

          package_path="${packages[0]}"
          package_name="$(basename "${package_path}")"
          version="${RELEASE_TAG#v}"
          if [[ "${package_name}" != safetensors-mojo-"${version}"-*.conda ]]; then
            echo "::error::Unexpected package filename: ${package_name}"
            exit 1
          fi

          mkdir dist
          cp -- "${package_path}" "dist/${package_name}"
          artifact="${PWD}/dist/${package_name}"
          echo "path=${artifact}" >> "${GITHUB_OUTPUT}"
          echo "name=${package_name}" >> "${GITHUB_OUTPUT}"
          sha256sum "${artifact}"

      - name: Reuse an existing GitHub Release package
        id: package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PATH: ${{ steps.candidate.outputs.path }}
          CANDIDATE_NAME: ${{ steps.candidate.outputs.name }}
        run: |
          set -euo pipefail

          package_path="${CANDIDATE_PATH}"
          asset_exists=false
          existing_dir="${RUNNER_TEMP}/existing-release-asset"
          assets_file="${RUNNER_TEMP}/release-assets.txt"
          mkdir -p "${existing_dir}"
          if gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets \
            --jq '.assets[].name' > "${assets_file}" 2> /dev/null \
            && grep -Fqx -- "${CANDIDATE_NAME}" "${assets_file}"; then
            gh release download "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${CANDIDATE_NAME}" \
              --dir "${existing_dir}"
            package_path="${existing_dir}/${CANDIDATE_NAME}"
            asset_exists=true
            echo "Reusing the existing GitHub Release package as canonical."
          fi

          {
            echo "path=${package_path}"
            echo "asset_exists=${asset_exists}"
          } >> "${GITHUB_OUTPUT}"
          sha256sum "${package_path}"

      - name: Smoke-test a clean package installation
        shell: bash
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail

          consumer_source="${GITHUB_WORKSPACE}/source/tools/packaging/consumers/package_smoke.mojo"
          if [[ ! -f "${consumer_source}" ]]; then
            consumer_source="${GITHUB_WORKSPACE}/source/tools/package_smoke.mojo"
          fi
          if [[ ! -f "${consumer_source}" ]]; then
            if [[ "${RELEASE_TAG}" != "v0.1.0" ]]; then
              echo "::error::Release tag has no package smoke consumer"
              exit 1
            fi
            consumer_source="${GITHUB_WORKSPACE}/release-tooling/tools/packaging/consumers/package_smoke_format_core.mojo"
          fi

          python \
            "${GITHUB_WORKSPACE}/release-tooling/tools/packaging/smoke_test.py" \
            "${PACKAGE_PATH}" \
            --consumer-source "${consumer_source}"

      - name: Check prefix.dev for an existing package
        id: prefix-preflight
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: >-
          python
          "${GITHUB_WORKSPACE}/release-tooling/tools/release/prefix_preflight.py"
          --channel "${PREFIX_CHANNEL}"
          --subdir linux-64
          --artifact "${PACKAGE_PATH}"
          --github-output "${GITHUB_OUTPUT}"

      - name: Ensure package is attached to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          ASSET_EXISTS: ${{ steps.package.outputs.asset_exists }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            if [[ "${ASSET_EXISTS}" == "false" ]]; then
              gh release upload "${RELEASE_TAG}" "${PACKAGE_PATH}" \
                --repo "${GITHUB_REPOSITORY}"
            else
              echo "GitHub Release already contains the canonical package."
            fi
          else
            if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != "tag" ]]; then
              echo "::error::${RELEASE_TAG} must be an annotated tag"
              exit 1
            fi
            release_notes="${RUNNER_TEMP}/release-notes.md"
            git for-each-ref \
              --format='%(contents)' \
              "refs/tags/${RELEASE_TAG}" > "${release_notes}"
            if [[ ! -s "${release_notes}" ]] || ! grep -q '^## ' "${release_notes}"; then
              echo "::error::Annotated tag must contain Markdown release notes"
              exit 1
            fi
            gh release create "${RELEASE_TAG}" \
              "${PACKAGE_PATH}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "safetensors.mojo ${RELEASE_TAG}" \
              --notes-file "${release_notes}"
          fi

      # Configure this exact workflow under the channel's Settings >
      # Repository Access with Read/write access. Pixi exchanges GitHub's
      # short-lived OIDC identity; no prefix.dev secret is stored in GitHub.
      - name: Publish package to prefix.dev
        if: ${{ steps.prefix-preflight.outputs.publish == 'true' }}
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: pixi upload prefix --channel "${PREFIX_CHANNEL}" "${PACKAGE_PATH}"
