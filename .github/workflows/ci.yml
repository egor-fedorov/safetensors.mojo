name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validate and build package (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: osx-arm64
            runner: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Pixi environment
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.77.1
          cache: true
          frozen: true

      - name: Run full validation and package build
        run: pixi run all

  fuzz:
    name: Run survival fuzz harness (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: osx-arm64
            runner: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Pixi environment
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.77.1
          cache: true
          frozen: true

      - name: Generate and run deterministic file corpus
        run: pixi run fuzz

      - name: Generate and run deterministic shard-index corpus
        run: pixi run fuzz-index
